[project]
name = "robstride-arm-environment"
version = "0.1.0"
description = "Python development environment for a RobStride arm targeting Jetson Orin Nano"
requires-python = ">=3.10,<3.11"
dependencies = [
    "pyserial>=3.5,<4",
    "robstride-control",
]

[dependency-groups]
dev = [
    "pip",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
robstride-control = { path = "vendor/RobStride_Control/python", editable = true }

[tool.ruff]
target-version = "py310"
extend-exclude = ["vendor", ".bootstrap"]
